<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="The Royal Nusantara">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Hotel building -->
  <rect x="26" y="10" width="12" height="7" rx="2" fill="#ffffff"/>
  <rect x="18" y="16" width="28" height="34" rx="3" fill="#ffffff"/>
  <!-- Windows -->
  <g fill="#b45309">
    <rect x="22" y="21" width="5" height="5" rx="1"/>
    <rect x="29.5" y="21" width="5" height="5" rx="1"/>
    <rect x="37" y="21" width="5" height="5" rx="1"/>
    <rect x="22" y="29" width="5" height="5" rx="1"/>
    <rect x="29.5" y="29" width="5" height="5" rx="1"/>
    <rect x="37" y="29" width="5" height="5" rx="1"/>
    <rect x="22" y="37" width="5" height="5" rx="1"/>
    <rect x="37" y="37" width="5" height="5" rx="1"/>
  </g>
  <!-- Door -->
  <rect x="28.5" y="40" width="7" height="10" rx="1.5" fill="#92400e"/>
  <!-- Ground line -->
  <rect x="13" y="50" width="38" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
